name: Publish images

# Publishes platform service container images to the GitHub Container Registry
# (GHCR) so Kubernetes can pull them. See
# docs/architecture/container-image-registry.md for the naming and tagging
# strategy this workflow implements, and
# docs/architecture/release-and-promotion.md for what happens to an image after
# it is published.
#
# Runs only on pushes to main — never on pull requests, so forks cannot publish
# and unmerged work never reaches the registry.
#
# It deliberately does NOT run on v* tags. A release version is applied to an
# already-tested digest by release-promotion.yml, which re-tags rather than
# rebuilds: building again on the tag would produce different image contents
# under a version whose contents were already approved (#264).

on:
  push:
    branches:
      - main

# Publishing a source tag and its convenience tag is one registry transaction
# per commit. Do not let two main pushes race to inspect, create, and verify
# the same mutable names; queued runs retain their evidence rather than being
# cancelled mid-publication.
concurrency:
  group: publish-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest

    # GITHUB_TOKEN needs write access to publish packages to GHCR. contents:read
    # is the least privilege needed to check out the repository.
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      # One service failing to publish must not silently skip the others.
      fail-fast: false
      matrix:
        service:
          - ingestion-service
          - telemetry-processor
          - query-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        # GITHUB_TOKEN is scoped to this repository and expires with the run, so
        # no long-lived registry credentials are stored.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.2

      - name: Prepare the image locally
        id: build
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          # GHCR namespaces must be lowercase; the owner login may contain
          # uppercase characters (e.g. ME-Massine).
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/pulsestream/${SERVICE}"
          short_sha="${GITHUB_SHA::7}"
          source_tag="sha-${short_sha}"
          local_image="pulsestream/${SERVICE}:candidate"
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          digest=""

          # Keep one digest per commit. Labels alone cannot authenticate an
          # existing tag: pin its digest and require a trusted signature binding
          # it to this commit before pulling or recording any reused content.
          if docker buildx imagetools inspect "${image}:${source_tag}" > /dev/null 2>&1; then
            digest="$(docker buildx imagetools inspect "${image}:${source_tag}" --format '{{.Manifest.Digest}}')"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid digest for ${image}:${source_tag}"
              exit 1
            fi
            cosign verify \
              --certificate-identity "${source_url}/.github/workflows/publish-images.yml@refs/heads/main" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              -a "source-commit=${GITHUB_SHA}" \
              "${image}@${digest}" > /dev/null

            source_revision="$(docker buildx imagetools inspect "${image}@${digest}" --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')"
            recorded_source="$(docker buildx imagetools inspect "${image}@${digest}" --format '{{index .Image.Config.Labels "org.opencontainers.image.source"}}')"
            if [ "${source_revision}" != "${GITHUB_SHA}" ] || [ "${recorded_source}" != "${source_url}" ]; then
              echo "::error::Existing digest does not match the expected source repository and commit."
              exit 1
            fi
            docker pull "${image}@${digest}"
            docker tag "${image}@${digest}" "${local_image}"
            rebuilt="false"
          else
            # Build only in the local daemon. No registry tags are exposed
            # until this exact image has passed the archive scan below.
            # Keep a single-platform manifest so reuse can inspect its config;
            # embedded BuildKit attestations would wrap it in an image index.
            docker build --provenance=false \
              --label "org.opencontainers.image.source=${source_url}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${source_tag}" \
              --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -t "${local_image}" \
              "services/${SERVICE}"
            rebuilt="true"
          fi

          local_id="$(docker image inspect "${local_image}" --format '{{.Id}}')"
          if ! [[ "${local_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not identify the local image to scan."
            exit 1
          fi
          docker save --output candidate.tar "${local_id}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "local_id=${local_id}" >> "$GITHUB_OUTPUT"
          echo "source_tag=${source_tag}" >> "$GITHUB_OUTPUT"
          echo "rebuilt=${rebuilt}" >> "$GITHUB_OUTPUT"

      - name: Scan before publication
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: candidate.tar
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate the scanned image SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: docker-archive:candidate.tar
          format: spdx-json
          output-file: ${{ matrix.service }}.spdx.json
          artifact-name: ${{ matrix.service }}-sbom.spdx.json
          upload-artifact: true

      - name: Publish the scanned image
        id: publish
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          LOCAL_ID: ${{ steps.build.outputs.local_id }}
          SOURCE_TAG: ${{ steps.build.outputs.source_tag }}
          REBUILT: ${{ steps.build.outputs.rebuilt }}
          SBOM: ${{ matrix.service }}.spdx.json
        run: |
          set -euo pipefail

          if [ "${REBUILT}" = "true" ]; then
            docker tag "${LOCAL_ID}" "${IMAGE}:${SOURCE_TAG}"
            docker push "${IMAGE}:${SOURCE_TAG}"
            # Get the pushed digest from the local daemon, never from a mutable
            # registry tag which another package writer could have repointed.
            DIGEST="$(docker image inspect "${LOCAL_ID}" --format '{{range .RepoDigests}}{{println .}}{{end}}' | sed -n "s|^${IMAGE}@||p")"
            if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not resolve the digest pushed from the scanned local image."
              exit 1
            fi
          fi

          source_digest="$(docker buildx imagetools inspect "${IMAGE}:${SOURCE_TAG}" --format '{{.Manifest.Digest}}')"
          if [ "${source_digest}" != "${DIGEST}" ]; then
            echo "::error::Source tag changed; refusing to sign or move latest."
            exit 1
          fi
          cosign attach sbom --sbom "${SBOM}" --type spdx "${IMAGE}@${DIGEST}"
          if [ "${REBUILT}" = "true" ]; then
            cosign sign --yes -a "source-commit=${GITHUB_SHA}" "${IMAGE}@${DIGEST}"
          fi

          # Expose the convenience tag only after the scan, SBOM and signature
          # have succeeded. Retagging must preserve the source manifest digest.
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
          latest_digest="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')"
          if [ "${latest_digest}" != "${DIGEST}" ]; then
            echo "::error::latest does not resolve to the scanned digest."
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Record the published digest
        run: |
          set -euo pipefail
          mkdir -p digests
          cat > "digests/${{ matrix.service }}.json" <<EOF
          {
            "service": "${{ matrix.service }}",
            "commit": "${GITHUB_SHA}",
            "repository": "${{ steps.build.outputs.image }}",
            "sourceTag": "${{ steps.build.outputs.source_tag }}",
            "digest": "${{ steps.publish.outputs.digest }}",
            "rebuilt": ${{ steps.build.outputs.rebuilt }},
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

          {
            echo "### ${{ matrix.service }}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Build tag | \`${{ steps.build.outputs.source_tag }}\` |"
            echo "| Digest | \`${{ steps.publish.outputs.digest }}\` |"
            echo "| Built this run | ${{ steps.build.outputs.rebuilt }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The digest is what release-promotion.yml promotes, so it is published as
      # an artifact rather than left only in a log line.
      - name: Upload the digest record
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.json
          retention-days: 90
          if-no-files-found: error

  digest-index:
    name: Publish the digest index
    runs-on: ubuntu-latest
    needs: publish
    # The index is worth having even if one service failed to publish: it then
    # records which services this commit does have images for.
    if: always()

    permissions:
      contents: read

    steps:
      - name: Download the digest records
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests

      - name: Merge into one index
        run: |
          set -euo pipefail

          if [ ! -d digests ] || [ -z "$(ls -A digests 2>/dev/null)" ]; then
            echo "::error::No digest records were produced for ${GITHUB_SHA}"
            exit 1
          fi

          jq -s --arg commit "${GITHUB_SHA}" \
            '{ commit: $commit, images: (map({ (.service): . }) | add) }' \
            digests/*.json > image-digests.json

          cat image-digests.json

          {
            echo "### Digest index for \`${GITHUB_SHA}\`"
            echo ""
            echo '```json'
            cat image-digests.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the digest index
        uses: actions/upload-artifact@v7
        with:
          name: image-digests
          path: image-digests.json
          retention-days: 90
          if-no-files-found: error

  validate-published-images:
    name: Published image runtime validation
    runs-on: ubuntu-latest
    needs: digest-index

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the published digest index
        uses: actions/download-artifact@v4
        with:
          name: image-digests
          path: provenance

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and probe the exact published digests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $index = Get-Content -LiteralPath ./provenance/image-digests.json -Raw | ConvertFrom-Json
          if ($index.commit -ne $env:GITHUB_SHA) {
              throw "Digest index records commit '$($index.commit)', not the workflow commit '$env:GITHUB_SHA'."
          }

          $references = foreach ($service in @("ingestion-service", "telemetry-processor", "query-service")) {
              $record = $index.images.PSObject.Properties[$service].Value
              if ($null -eq $record -or $record.commit -ne $env:GITHUB_SHA -or
                  $record.repository -notmatch '^ghcr\.io/[^/]+/pulsestream/(ingestion-service|telemetry-processor|query-service)$' -or
                  $record.digest -notmatch '^sha256:[0-9a-f]{64}$') {
                  throw "Digest index has no valid provenance record for '$service'."
              }
              "$service=$($record.repository)@$($record.digest)"
          }

          ./scripts/validate-container-images.ps1 -Network bridge -ImageReference $references -TimeoutSeconds 120

          # This artifact is emitted only after every exact digest was pulled
          # and its deployed probe paths reported UP. Promotion consumes it
          # instead of resolving a mutable sha-* tag.
          $index | Add-Member -NotePropertyName validationRunUrl -NotePropertyValue "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $index | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath ./provenance/validated-image-digests.json -NoNewline

      - name: Upload validated digest provenance
        uses: actions/upload-artifact@v7
        with:
          name: validated-image-digests
          path: provenance/validated-image-digests.json
          retention-days: 90
          if-no-files-found: error
