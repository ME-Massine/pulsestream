name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

# A pull request is already the review event for feature branches. Limiting push
# runs to long-lived branches avoids running the same full workflow twice for
# one proposed commit. A newer pull request commit cancels the run it
# supersedes. Push runs use a separate group for each commit so newer pushes
# cannot cancel pending validation required for release promotion.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  repo-sanity:
    name: Repository sanity checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required repository files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/ISSUE_TEMPLATE/bug_report.yml
          test -f .github/ISSUE_TEMPLATE/feature.yml
          test -f .github/ISSUE_TEMPLATE/task.yml

      - name: Validate required directories
        run: |
          test -d docs
          test -d docs/architecture
          test -d docs/decisions
          test -d docs/diagrams

  service-verify:
    name: Service verify (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - ingestion-service
          - telemetry-processor
          - query-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      # verify covers compilation, tests, packaging, the JaCoCo report, and the
      # non-regression coverage check declared by each service POM.
      - name: Run Maven verify
        working-directory: services/${{ matrix.service }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep the Unix wrapper executable in the checkout even if a local
          # filesystem or archive operation dropped its mode bit.
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Summarise coverage
        if: always()
        shell: bash
        run: |
          report="services/${{ matrix.service }}/target/site/jacoco/jacoco.csv"
          if [ ! -f "${report}" ]; then
            echo "No JaCoCo report at ${report}: the build failed before reporting." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python3 scripts/ci/summarise-coverage.py \
            "${report}" "${{ matrix.service }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  release-manifests:
    name: Release manifest consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Catches the two ways a manifest set stops describing one tested build:
      # a service pinned to a different commit than its neighbours, and a
      # manifest left on the digest of a previous release. Neither needs a
      # cluster or a registry - the committed files are compared with each
      # other - so this runs on every pull request. See
      # docs/architecture/release-and-promotion.md.
      - name: Validate deployment image references
        shell: pwsh
        run: ./scripts/validate-release-manifests.ps1

      - name: Run the release promotion unit tests
        shell: pwsh
        run: ./scripts/tests/test-release-promotion.ps1

  platform-container-images:
    name: Platform container images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build, start, and probe every platform image
        shell: pwsh
        run: ./scripts/validate-container-images.ps1 -Network bridge -TimeoutSeconds 120

  published-image-runtime-validation:
    name: Published image runtime validation
    runs-on: ubuntu-latest

    # Pulling an exact repository@digest is the invariant that promotion later
    # relies on. PRs must exercise that path without publishing unmerged work
    # to GHCR, so this job uses an ephemeral local OCI registry instead.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start an ephemeral OCI registry
        run: |
          set -euo pipefail
          docker run -d --name pulsestream-ci-registry -p 5000:5000 registry:2
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/v2/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Registry did not become ready."
          exit 1

      - name: Build, publish, and verify immutable digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail

          refs_file="${RUNNER_TEMP}/pulsestream-image-references"
          : > "${refs_file}"

          for service in ingestion-service telemetry-processor query-service; do
            image="localhost:5000/pulsestream/${service}"
            tag="sha-${GITHUB_SHA::7}"

            # Match the labels used by publish-images.yml. The local registry
            # makes the digest a real registry digest, not a Docker image ID.
            docker build \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${tag}" \
              -t "${image}:${tag}" \
              "services/${service}"
            docker push "${image}:${tag}"

            digest="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}')"
            test -n "${digest}"
            test "$(docker buildx imagetools inspect "${image}@${digest}" --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"

            echo "${service}=${image}@${digest}" | tee -a "${refs_file}"
          done

          echo "references_file=${refs_file}" >> "${GITHUB_OUTPUT}"

      - name: Pull and probe the exact local digests
        shell: pwsh
        env:
          REFERENCES_FILE: ${{ steps.digests.outputs.references_file }}
        run: |
          $ErrorActionPreference = "Stop"
          $references = @(Get-Content -LiteralPath $env:REFERENCES_FILE)
          if ($references.Count -ne 3) {
              throw "Expected exact digest references for all three platform services, got $($references.Count)."
          }

          ./scripts/validate-container-images.ps1 `
              -Network bridge `
              -ImageReference $references `
              -TimeoutSeconds 120

      - name: Remove the ephemeral OCI registry
        if: always()
        run: docker rm -f pulsestream-ci-registry 2> /dev/null || true

  compose-config:
    name: Docker Compose configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f infrastructure/docker/docker-compose.yml config --quiet

      - name: Report resolved services
        run: docker compose -f infrastructure/docker/docker-compose.yml config --services

  kubernetes-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest

    env:
      KUBECONFORM_VERSION: v0.6.7
      KUBERNETES_VERSION: "1.30.0"
      STRIMZI_CRD_CATALOG_COMMIT: ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Download Strimzi schemas
        shell: bash
        run: |
          set -euo pipefail
          schema_dir="${RUNNER_TEMP}/kubeconform-schemas/kafka.strimzi.io"
          mkdir -p "${schema_dir}"
          base="https://raw.githubusercontent.com/datreeio/CRDs-catalog/${STRIMZI_CRD_CATALOG_COMMIT}/kafka.strimzi.io"
          # kubeconform lowercases ResourceKind when it expands the schema
          # lookup template, so the files keep the catalog's lowercase names.
          # The commit is pinned; retries cover transient network failures.
          for kind in kafka kafkanodepool kafkatopic; do
            curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
              "${base}/${kind}_v1.json" -o "${schema_dir}/${kind}_v1.json"
          done

      # Helm values files are inputs to charts, not Kubernetes resources, and
      # are named *-values.yaml by convention. The CRD catalog makes Strimzi
      # Kafka, KafkaNodePool, and KafkaTopic resources validate under the same
      # strict, fail-closed command as built-in kinds.
      - name: Validate Kubernetes resources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(
            find infrastructure/kubernetes -type f -name '*.yaml' \
              ! -name '*-values.yaml' | sort
          )
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Kubernetes manifests found."
            exit 1
          fi
          echo "Validating ${#manifests[@]} manifest file(s)"
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location "${RUNNER_TEMP}/kubeconform-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            "${manifests[@]}"

  # Windows runners cannot run the Linux containers kind needs, so the suite is
  # split: everything that needs no API server runs on both PowerShell editions
  # here, and the tests that need kubectl API discovery run on Linux below. Each
  # half is strict - nothing is skipped silently - so together they cover every
  # test file.
  powershell-checks:
    name: PowerShell checks (${{ matrix.edition }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        edition:
          - pwsh
          - powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse helpers and run offline regression tests (PowerShell 7)
        if: matrix.edition == 'pwsh'
        shell: pwsh
        run: ./scripts/tests/run-all-tests.ps1 -Scope Offline

      - name: Parse helpers and run offline regression tests (Windows PowerShell 5.1)
        if: matrix.edition == 'powershell'
        shell: powershell
        run: .\scripts\tests\run-all-tests.ps1 -Scope Offline

  powershell-cluster-tests:
    name: PowerShell cluster-dependent tests
    runs-on: ubuntu-latest

    env:
      KIND_VERSION: v0.29.0
      KIND_NODE_IMAGE: kindest/node:v1.30.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # kubectl create --dry-run=client still performs API discovery for the
      # resource kinds exercised by the structural tests. Provide a disposable
      # API server so those tests execute instead of being skipped.
      - name: Start disposable Kubernetes API
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
            -o "${RUNNER_TEMP}/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "${RUNNER_TEMP}/kind"
          "${RUNNER_TEMP}/kind" create cluster \
            --name pulsestream-ci \
            --image "${KIND_NODE_IMAGE}" \
            --wait 90s
          kubectl cluster-info --context kind-pulsestream-ci

      - name: Run cluster-dependent regression tests
        shell: pwsh
        run: ./scripts/tests/run-all-tests.ps1 -Scope Cluster

      - name: Remove disposable Kubernetes API
        if: always()
        shell: bash
        run: |
          if [ -x "${RUNNER_TEMP}/kind" ]; then
            "${RUNNER_TEMP}/kind" delete cluster --name pulsestream-ci \
              || echo "::warning::kind cleanup failed."
          fi
