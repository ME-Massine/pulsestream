# Kubernetes Deployment for the telemetry-processor stream consumer.
#
# Image, tag, and registry conventions follow
# docs/architecture/container-image-registry.md. The image is pinned to an
# immutable per-commit tag (sha-<short>) rather than `latest`, which the doc
# marks as mutable and unfit for reproducible deploys.
#
# This reference is not edited by hand: the Release promotion workflow rewrites
# it to the promoted digest and opens a pull request for it, and CI requires
# every service here to name one commit (#264). To roll out a different build,
# promote it - see docs/architecture/release-and-promotion.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-processor
  labels:
    app.kubernetes.io/name: telemetry-processor
    app.kubernetes.io/component: stream-processor
    app.kubernetes.io/part-of: pulsestream
spec:
  # Kafka consumer group member: replicas share topic partitions, so two gives
  # basic availability during node drains and rolling updates. This is also the
  # HPA's minReplicas floor (hpa.yaml, #151) - the autoscaler moves replicas
  # within [2, 3] from here, 3 being the partition count of
  # `telemetry.events.raw`.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-processor
        app.kubernetes.io/component: stream-processor
        app.kubernetes.io/part-of: pulsestream
    spec:
      # GHCR packages default to private; a `ghcr-pull` secret with read:packages
      # is required unless the package is made public. See the registry doc.
      # A missing secret only warns for a public image, so this stays safe either way.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # The image (Dockerfile system user `spring`) runs as uid/gid 999. Kubelet
        # can only verify runAsNonRoot against a numeric user, so the UID is pinned
        # explicitly; relying on the named `spring` user fails at container start
        # with "cannot verify user is non-root".
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetry-processor
          image: ghcr.io/me-massine/pulsestream/telemetry-processor:sha-5f5e845
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          # Runtime configuration is externalized (#136): non-sensitive values
          # (Kafka/Postgres endpoints, log levels) come from the ConfigMap
          # (configmap.yaml); the sensitive datasource username/password come
          # from the telemetry-processor-secret Secret. That Secret is NOT
          # committed — it is provisioned out-of-band (see secret.example.yaml
          # for the required name/keys), so no credential is hardcoded in this
          # repository and the manifest stays reusable across environments.
          envFrom:
            - configMapRef:
                name: telemetry-processor-config
            - secretRef:
                name: telemetry-processor-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Root filesystem is read-only for hardening. The embedded Tomcat
          # still needs a writable java.io.tmpdir, so /tmp is backed by an
          # ephemeral emptyDir instead of the container layer.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Spring Boot Actuator Kubernetes probe groups (#137). The full actuator
          # surface (including the state-changing dlqreplay endpoint) stays on the
          # loopback-bound management port (9083); application.yml mirrors only the
          # liveness/readiness groups to /livez and /readyz on the main port
          # (8082, `http`), so kubelet can reach the probes over the pod network
          # without exposing dlqreplay. Readiness reflects ReadinessState so the
          # pod only takes traffic once the context is ready; liveness reflects
          # only LivenessState, so a failing dependency (e.g. Kafka/Postgres) does
          # not trigger restart loops.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
