# Node pool for the PulseStream Kafka cluster.
#
# Strimzi splits a cluster into node pools: the Kafka resource
# (kafka-cluster.yaml) declares what the cluster is, a KafkaNodePool declares
# how many nodes provide it, which roles they take, and what storage they use.
# The operator turns this into the underlying pods; nothing here describes a
# StatefulSet, because the pods are managed by the operator through a
# StrimziPodSet rather than by a workload controller in this repository (ADR
# 0005).
#
# The `strimzi.io/cluster` label is the binding to the Kafka resource. It is not
# decorative: a pool with the wrong value is silently ignored by the operator.
#
# The storage is persistent (#140): each node is backed by a PersistentVolume
# through a per-node PVC, so broker data survives pod restarts and rescheduling.
# See the storage section.
#
# Deliberately NOT here (each has its own issue):
#   - topic provisioning (#141)
#   - metrics/observability integration (#154+)
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: pulsestream
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: pulsestream
spec:
  # Three nodes: the smallest count that supports a replication factor of 3 with
  # min.insync.replicas=2, i.e. the cluster keeps accepting writes while exactly
  # one node is down (rolling restart, node drain, single failure). It is also
  # the smallest odd number that gives the KRaft controller quorum a real
  # majority, so it tolerates losing one voter without losing metadata
  # availability.
  #
  # Unlike the raw-manifest approach, this number is the only place the count is
  # written: the operator derives the quorum voter list and the per-node
  # identities from it, so there is no second value to keep in sync.
  replicas: 3
  # Combined mode: every node is both a broker and a KRaft controller, so these
  # three pods are a complete cluster with no ZooKeeper and no separate
  # controller pool. A split broker/controller topology is the alternative once
  # the cluster is large enough for the controllers to warrant their own nodes;
  # at three nodes it would only add pods.
  roles:
    - controller
    - broker
  storage:
    # JBOD with a single volume rather than a bare `ephemeral` type: it is the
    # shape Strimzi expects for KRaft metadata (`kraftMetadata` is a per-volume
    # setting) and adding a second disk later does not require rewriting the
    # storage type, which would be a cluster-wide change.
    type: jbod
    volumes:
      # Persistent, backed by a PersistentVolumeClaim (#140): the operator
      # requests a PVC per node, so a rescheduled or restarted pod re-attaches
      # its own volume and restarts with its log dir intact instead of refilling
      # from replicas.
      #
      # Two Strimzi constraints shape how this volume may change later:
      #   - A volume's `type` cannot be changed in place. Editing this from
      #     `persistent-claim` back to `ephemeral` (or vice versa) on a live
      #     cluster is ignored by the operator with a warning; the switch from
      #     the original ephemeral #139 cluster to this one is a delete/recreate,
      #     documented under "Migrating a cluster already deployed from #139" in
      #     README.md.
      #   - The claim name is keyed on this `id` (data-<id>-...), so renumbering
      #     this volume points the broker at a new, empty disk and orphans the
      #     old PVC. Adding capacity is therefore done by adding a *second*
      #     volume with a new id — the operator's supported add-volume-and-
      #     reassign path — not by changing this one.
      - id: 0
        type: persistent-claim
        # 20Gi per broker. Sizing follows the broker config in
        # kafka-cluster.yaml: log.retention.bytes caps each partition replica at
        # 1Gi, and with replication factor 3 across 3 brokers every broker holds
        # a replica of every partition — the four platform topics (ADR 0001) are
        # 10 partitions, so ~10Gi of topic data at steady state. The remainder is
        # headroom for segment rollover (a partition can exceed its retention cap
        # until the open 1Gi segment closes), the KRaft metadata log, and Kafka's
        # internal topics.
        size: 20Gi
        # No storageClassName, so the operator uses the cluster's default
        # StorageClass. That is the portable choice: it provisions on Docker
        # Desktop, kind, and minikube (hostpath / local-path) and on a managed
        # cluster (EBS, PD, ...) without pinning this manifest to one
        # environment's class name. Set it here if a specific class is required.
        #
        # deleteClaim: false keeps the PVC — and the broker's data — when the
        # node pool or cluster is deleted, so `kubectl delete` is not a data-loss
        # event. The trade-off is that the PVCs must be removed by hand to
        # reclaim the storage. It is also the operator default; stated
        # explicitly so the intent is visible in the manifest.
        deleteClaim: false
        # Keeps the KRaft metadata log on this volume. With a single volume it
        # is where it would land anyway, but stating it means adding a second
        # volume later does not silently move the metadata log.
        kraftMetadata: shared
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1536Mi
  # Heap is set explicitly rather than left to the container default, so the JVM
  # cannot grow into the memory limit above and get the pod OOM-killed. The
  # remainder of the limit is deliberate headroom for non-heap memory: page
  # cache, direct buffers, and the JVM itself.
  jvmOptions:
    -Xms: 512m
    -Xmx: 768m
