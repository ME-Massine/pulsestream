# The platform dashboards, as Grafana loads them in the cluster (#156).
#
# THE LABEL CONTRACT THESE QUERIES SELECT ON.
# #154 scrapes the platform with one job per workload - `ingestion-service` and
# `query-service` - discovered by role: pod, and relabels `namespace`, `pod` and
# `node` onto every series. The workload name is therefore carried by `job`, the
# same label the Compose deployment uses for it:
#
#   Compose      static target, one job per service   ->  job="ingestion-service"
#   Kubernetes   pod discovery, one job per workload  ->  job="ingestion-service"
#                                                         + namespace, pod, node
#
# There is no `service` label in the cluster: ../prometheus-values.yaml relabels
# three meta labels and that is not one of them. Selecting on a label Prometheus
# does not produce is not an error - the panel draws an empty graph - so
# scripts/tests/test-grafana-dashboard-provisioning.ps1 holds every expression
# here to the labels #154 actually writes.
#
# WHY A SEPARATE SET AT ALL, now that the selector is shared. Two reasons, both
# consequences of pods being plural where a Compose container is singular: the
# per-pod panels in Service Health break their series out by `pod`, and the tags
# carry `kubernetes`. `ingestion-metrics.json` has no per-pod panel and is the
# Compose dashboard apart from that tag; it stays in this file because Grafana
# in the cluster loads dashboards from a ConfigMap and cannot read
# observability/grafana/dashboards/ off the host.
#
# Everything else is shared - same UIDs, same titles, same panel IDs - and the
# structural test fails if a panel is added to one set and not the other. Which
# panels differ and why is spelled out in
# observability/grafana/dashboards/README.md.
#
# THE JSON IS INLINE rather than generated from those files, because a build
# step and a generated artefact would not remove the per-pod differences that
# make the two sets two sets.
#
# Kept small on purpose: a ConfigMap cannot exceed 1 MiB, which is roughly a
# dozen dashboards of this size. Past that, dashboards move to one ConfigMap
# each and the provider picks up all of them from the same mount.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: pulsestream
    # Watched by the grafana chart's dashboard sidecar. See README.md.
    grafana_dashboard: "1"
data:
  service-health.json: |
    {
      "uid": "pulsestream-service-health",
      "title": "Service Health",
      "tags": ["pulsestream", "kubernetes"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "job",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(process_uptime_seconds, job)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "JVM Memory Used",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "bytes" },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{job=~\"$job\"}) by (job, pod)",
              "legendFormat": "{{job}}/{{pod}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "CPU Usage",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "max": 1, "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "expr": "process_cpu_usage{job=~\"$job\"}",
              "legendFormat": "{{job}}/{{pod}} process"
            },
            {
              "expr": "system_cpu_usage{job=~\"$job\"}",
              "legendFormat": "{{job}}/{{pod}} system"
            }
          ]
        },
        {
          "id": 3,
          "title": "Uptime",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "dtdurations" },
            "overrides": []
          },
          "targets": [
            {
              "expr": "process_uptime_seconds{job=~\"$job\"}",
              "legendFormat": "{{job}}/{{pod}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Request Count",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "reqps" },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=~\"$job\"}[1m])) by (job)",
              "legendFormat": "{{job}}"
            }
          ]
        }
      ]
    }
  ingestion-metrics.json: |
    {
      "uid": "pulsestream-ingestion-metrics",
      "title": "Ingestion Metrics",
      "tags": ["pulsestream", "ingestion", "kubernetes"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "reqps" },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"ingestion-service\", uri=\"/api/v1/events\"}[1m]))",
              "legendFormat": "requests/s"
            }
          ]
        },
        {
          "id": 2,
          "title": "Success vs Failure Count",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "short" },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(increase(http_server_requests_seconds_count{job=\"ingestion-service\", uri=\"/api/v1/events\"}[$__range])) by (outcome)",
              "legendFormat": "{{outcome}} count"
            }
          ]
        },
        {
          "id": 3,
          "title": "Average Ingestion Latency",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "s" },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_sum{job=\"ingestion-service\", uri=\"/api/v1/events\"}[1m])) / sum(rate(http_server_requests_seconds_count{job=\"ingestion-service\", uri=\"/api/v1/events\"}[1m]))",
              "legendFormat": "avg latency"
            }
          ]
        }
      ]
    }
