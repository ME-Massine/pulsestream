# ServiceAccount for the OpenTelemetry Collector (#157).
#
# It holds NO RBAC. The collector's pipeline is receive -> process -> export and
# touches no Kubernetes API: there is no `k8sattributes` processor and no
# `k8s_cluster` receiver, which are the components that would need `pods` reads.
# A dedicated account with no bindings therefore keeps the workload off the
# `default` ServiceAccount, whose permissions are not this manifest's to reason
# about; if a Kubernetes-aware component is added later, the Role it needs is
# bound here and stays visible in one place.
#
# The API token is not mounted for the same reason: nothing in the pod calls the
# API server, so mounting a credential would only widen what a compromised
# collector could reach.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: tracing
    app.kubernetes.io/part-of: pulsestream
automountServiceAccountToken: false
