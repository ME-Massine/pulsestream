# ServiceAccount for the Jaeger tracing backend (#158).
#
# No RBAC and no mounted API token, for the same reason as the collector's
# account (serviceaccount.yaml): all-in-one receives spans, stores them in
# memory and serves a UI. Nothing in it calls the Kubernetes API, so a mounted
# credential would only widen what a compromised pod could reach.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaeger
  namespace: observability
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing-backend
    app.kubernetes.io/part-of: pulsestream
automountServiceAccountToken: false
