# Cluster-internal endpoint for the ingestion-service REST ingest gateway.
#
# The Service name matches the Deployment and app label so callers get the
# stable in-cluster DNS name `ingestion-service`. This Service stays ClusterIP:
# external exposure is a separate NodePort Service (service-nodeport.yaml, #145)
# so the in-cluster name above keeps the same meaning whether or not the
# external entry point is deployed.
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  labels:
    app.kubernetes.io/name: ingestion-service
    app.kubernetes.io/component: ingest-gateway
    app.kubernetes.io/part-of: pulsestream
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingestion-service
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: http
