name: pulsestream-local

services:
  kafka:
    image: confluentinc/cp-kafka:8.3.2
    container_name: pulsestream-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
      - "${KAFKA_INTERNAL_PORT:-29092}:29092"
    environment:
      # KRaft: this single node is both the broker and its own metadata
      # controller. Confluent Platform 8 no longer supports ZooKeeper.
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID:-1}@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}

      # Listeners
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Replication / Reliability (Dev defaults)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      
      # Broker Settings
      KAFKA_MESSAGE_MAX_BYTES: ${KAFKA_MESSAGE_MAX_BYTES:-10485760}
      KAFKA_REPLICA_FETCH_MAX_BYTES: ${KAFKA_REPLICA_FETCH_MAX_BYTES:-10485760}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}

      # Topic retention
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-1073741824}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-1073741824}
      
      # Partitions
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
    volumes:
      # A ZooKeeper-mode log directory cannot be reused by a KRaft node, so KRaft
      # data lives in its own volume (see README: "Kafka KRaft upgrade").
      - kafka_kraft_data:/var/lib/kafka/data
      - ./kafka/check-health.sh:/usr/bin/check-health:ro
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bash", "/usr/bin/check-health" ]
      start_period: 30s
      interval: 15s
      timeout: 30s
      retries: 10
    networks:
      - pulsestream-net

  kafka-init:
    image: confluentinc/cp-kafka:8.3.2
    container_name: pulsestream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      KAFKA_REPLICATION_FACTOR: 1
    networks:
      - pulsestream-net

  postgres:
    image: postgres:18
    container_name: pulsestream-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsestream}
      POSTGRES_USER: ${POSTGRES_USER:-pulsestream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsestream}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA in a major-version subdirectory
      # (/var/lib/postgresql/18/docker), so the volume is mounted one level up.
      # Version 16 data lived in postgres_data and needs a dump/restore to move
      # here (see README: "PostgreSQL 18 upgrade").
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsestream} -d ${POSTGRES_DB:-pulsestream}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pulsestream-net

  redis:
    image: redis:7
    container_name: pulsestream-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pulsestream-net

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: pulsestream-prometheus
    depends_on:
      - kafka
      - postgres
      - redis
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pulsestream-net

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: pulsestream-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"        # Jaeger UI
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC receiver
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP receiver
    networks:
      - pulsestream-net

  grafana:
    image: grafana/grafana:13.2.4
    container_name: pulsestream-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Version-controlled dashboard JSON lives under /observability (issue #110).
      - ../../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - pulsestream-net

volumes:
  kafka_kraft_data:
  postgres18_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  pulsestream-net:
    driver: bridge
