# The Maven wrapper downloads its own Maven distribution on first use. Without a
# checksum that download is trusted on transport security alone, so a compromised
# or substituted archive would be unpacked and executed by the build. mvnw and
# mvnw.cmd both verify distributionSha256Sum before unpacking and abort the build
# on a mismatch.
#
# The value below is the SHA-256 of the artifact whose published SHA-512 matches
# on both Maven Central and archive.apache.org. Update it whenever
# distributionUrl changes - the wrapper fails closed, not open.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.14/apache-maven-3.9.14-bin.zip
distributionSha256Sum=55fadd669532a3205d5db95f490bf13971d8b0843526f407f29db0e61f074ab3
