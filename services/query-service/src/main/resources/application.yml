spring:
  application:
    name: query-service
  datasource:
    url: ${PULSESTREAM_POSTGRES_URL:jdbc:postgresql://localhost:5432/pulsestream}
    username: ${PULSESTREAM_POSTGRES_USERNAME}
    password: ${PULSESTREAM_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      read-only: true
      maximum-pool-size: 5
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 2
        socketTimeout: 5

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,db
      # Expose the Kubernetes liveness/readiness health groups and mirror them to
      # /livez and /readyz on the main server port, so the Deployment probes align
      # with Spring Boot Actuator instead of hitting the aggregate /actuator/health
      # (a failing dependency in the aggregate would otherwise fail liveness and
      # trigger pointless restarts). See infrastructure/kubernetes/*/deployment.yaml.
      probes:
        enabled: true
        add-additional-paths: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.pulsestream.query: INFO
  pattern:
    level: "%5p [${spring.application.name:},trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
